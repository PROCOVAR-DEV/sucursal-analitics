server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Assets con hash en el nombre: se pueden cachear indefinidamente.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea, para que cada deploy se vea al instante.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # Frontend SPA — la raíz "/" también sirve index.html y NO debe cachearse
  # (si no, el navegador queda clavado en un bundle viejo).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  # API proxy al backend.
  # El upstream va en una variable a propósito: con un host literal, nginx lo
  # resuelve al arrancar y muere ("host not found in upstream") si el servicio
  # no existe todavía o se llama distinto (p. ej. detrás de un reverse proxy
  # que ya enruta /api por su cuenta). Con variable + resolver, resuelve por
  # petición y el contenedor arranca igual.
  location /api/ {
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $analitics_backend "backend";
    proxy_pass http://$analitics_backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }
}
